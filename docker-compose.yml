
services:
  postgres:
    image: postgres:16

    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 111
      POSTGRES_DB: project_task_db

    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
volumes:
  db_data: